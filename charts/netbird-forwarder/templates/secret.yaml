{{- if not .Values.netbird.setupKey.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "netbird-forwarder.fullname" . }}
  labels:
    {{- include "netbird-forwarder.labels" . | nindent 4 }}
type: Opaque
stringData:
  setup-key: {{ .Values.netbird.setupKey.value | quote }}
{{- end }}
